        <!-- ================ investment section start ================= -->
        <section class="omp-packages">
            <div class="container">

                <p class="omp-state" x-show="loading" x-text="states.loading"></p>
                <p class="omp-state omp-state--error" x-cloak x-show="!loading && notice" x-text="notice"></p>
                <p class="omp-state" x-cloak x-show="!loading && !packages.length"
                    x-text="states.emptyPackages"></p>

                <div x-cloak x-show="packages.length">
                    <template x-for="(package_, index) in packages" :key="package_.id">
                        <!-- Un paquete es una franja editorial, no una tarjeta: el
                             lado del texto alterna con la posición, como los bloques
                             de categoría del Home. El orden lo fija DisplayOrder en
                             sortByDisplayOrder(). -->
                        <article class="omp-package" :class="{ 'omp-package--flip': index % 2 === 1 }">
                            <div class="row align-items-center omp-package__row">

                                <!-- PackageDto no trae fotografía: la del bloque es
                                     provisional. Sin ella el <template> no inserta
                                     nada y la columna de texto pasa a ancho completo,
                                     sin hueco que rellenar. -->
                                <template x-if="packagePhoto(index)">
                                    <div class="col-lg-6">
                                        <div class="omp-package__photo omp-zoom" data-omp-reveal="scale">
                                            <img :src="thumb(packagePhoto(index))"
                                                 :srcset="srcset(packagePhoto(index))"
                                                 sizes="(min-width: 992px) 50vw, 100vw"
                                                 :alt="alt(packagePhoto(index))"
                                                 loading="lazy" decoding="async">
                                        </div>
                                    </div>
                                </template>

                                <div :class="packagePhoto(index) ? 'col-lg-6' : 'col-12'">
                                    <!-- El escalonado es por bloque y no por página:
                                         cada paquete entra con su propia cascada
                                         cuando le toca, no con el retardo acumulado
                                         de los que quedaron arriba. -->
                                    <div class="omp-package__text" data-omp-reveal-stagger="110">

                                        <div class="omp-package__header" data-omp-reveal="up">
                                            <p class="omp-eyebrow omp-package__duration"
                                               x-show="package_.duration" x-text="package_.duration"></p>
                                            <h3 class="omp-package__name" x-text="package_.name"></h3>
                                            <p class="omp-package__price" x-text="formatPrice(package_)"></p>
                                        </div>

                                        <p class="omp-package__description" x-show="package_.description"
                                           x-text="package_.description" data-omp-reveal="up"></p>

                                        <!-- Includes es texto multilínea: un concepto
                                             por renglón. La viñeta es un filete nude
                                             dibujado en CSS, no un carácter. -->
                                        <ul class="omp-package__includes" data-omp-reveal="up">
                                            <template x-for="(item, line) in includesList(package_)" :key="line">
                                                <li x-text="item"></li>
                                            </template>
                                        </ul>

                                        <p class="omp-package__action" data-omp-reveal="up">
                                            <a class="omp-eyebrow omp-link-quiet" :href="bookingHref(package_)"
                                               x-text="content.ctaLabel"></a>
                                        </p>

                                    </div>
                                </div>

                            </div>
                        </article>
                    </template>
                </div>

            </div>
