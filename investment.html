    <!-- Toda la página comparte el módulo investmentPage. -->
    <div x-data="investmentPage" x-init="init()">

        <!-- bradcam_area  -->
        <div class="bradcam_area breadcam_bg_3 black_overlay">
            <div class="container">
                <div class="row">
                    <div class="col-xl-12">
                        <div class="bradcam_text text-center">
                            <h3 x-text="content.title"></h3>
                            <p x-text="content.subtitle"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- / bradcam_area  -->

        <!-- ================ investment section start ================= -->
        <div class="team_area">
            <div class="container">

                <p class="omp-state" x-show="loading" x-text="states.loading"></p>
                <p class="omp-state omp-state--error" x-cloak x-show="!loading && notice" x-text="notice"></p>
                <p class="omp-state" x-cloak x-show="!loading && !notice && !packages.length"
                    x-text="states.emptyPackages"></p>

                <!-- .border_bottom es el contenedor bajo el que el template
                     anida el CSS de single_team; su línea se anula en
                     omp-custom.css. -->
                <div class="border_bottom" x-cloak x-show="packages.length">
                    <div class="row justify-content-center">
                        <template x-for="package_ in packages" :key="package_.id">
                            <div class="col-xl-4 col-lg-4 col-md-6">
                                <div class="single_team omp-package">
                                    <div class="team_info text-center">
                                        <h3 x-text="package_.name"></h3>
                                        <p class="omp-package-duration" x-show="package_.duration"
                                            x-text="package_.duration"></p>
                                        <span class="omp-package-price" x-text="formatPrice(package_)"></span>
                                    </div>

                                    <p class="omp-package-description" x-show="package_.description"
                                        x-text="package_.description"></p>

                                    <!-- Includes es texto multilínea: un
                                         concepto por renglón. -->
                                    <ul class="omp-package-includes">
                                        <template x-for="(item, index) in includesList(package_)" :key="index">
                                            <li x-text="item"></li>
                                        </template>
                                    </ul>

                                    <div class="text-center">
                                        <a class="boxed-btn" :href="bookingHref(package_)"
                                            x-text="content.ctaLabel"></a>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </div>
        <!-- ================ investment section end ================= -->

    </div>
