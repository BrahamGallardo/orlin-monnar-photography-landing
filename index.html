    <meta charset="utf-8">

    <title>Orlin Monnar Photography &amp; Films</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- <link rel="manifest" href="site.webmanifest"> -->
    <!-- Place favicon.ico in the root directory -->

    <!-- CSS here -->
    <link rel="icon" href="img/favicon.png">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/themify-icons.css">
    <link rel="stylesheet" href="css/nice-select.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/gijgo.css">

    <link rel="stylesheet" href="css/slicknav.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Estilos propios: único CSS que editamos. -->
    <link rel="stylesheet" href="css/omp-custom.css">
    <!-- <link rel="stylesheet" href="css/responsive.css"> -->
</head>

<body>
    <!--[if lte IE 9]>

    <!-- header-start -->
    <header>
        <div class="header-area ">
            <div id="sticky-header" class="main-header-area">
                <div class="container-fluid">
                    <div class="row align-items-center">
                        <div class="col-xl-3 col-lg-2">
                            <div class="logo">
                                <a href="index.html">
                                    <img src="img/logo-omp.png" alt="Orlin Monnar Photography &amp; Films">
                                </a>
                            </div>
                        </div>
                        <div class="col-xl-6 col-lg-7">
                            <div class="main-menu  d-none d-lg-block">
                                <nav>
                                    <ul id="navigation">
                                        <li><a class="active" href="index.html">Home</a></li>
                                        <li><a href="about.html">About</a></li>
                                        <li><a href="gallery.html">Gallery</a></li>
                                        <li><a href="investment.html">Investment</a></li>
                                        <li><a href="booking.html">Booking</a></li>
                                        <li><a href="contact.html">Contact</a></li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <div class="col-xl-3 col-lg-3 d-none d-lg-block">
                            <div class="social_links">
                                <ul>
                                    <li><a href="#"> <i class="fa fa-facebook"></i> </a></li>
                                    <li><a href="#"> <i class="fa fa-twitter"></i> </a></li>
                                    <li><a href="#"> <i class="fa fa-instagram"></i> </a></li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="mobile_menu d-block d-lg-none"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </header>
    <!-- header-end -->

    <!-- Todas las secciones dinámicas del Home comparten el módulo homePage. -->
    <div x-data="homePage" x-init="init()">

        <!-- slider_area_start -->
        <div class="slider_area">
            <!-- Owl Carousel clona y reubica los slides, así que Alpine no debe
                 gestionar este subárbol: se puebla desde renderHeroSlides()
                 antes de inicializar el plugin. Sin x-cloak, porque x-ignore
                 impide que Alpine llegue a retirarlo. -->
            <div class="slider_active owl-carousel" x-ignore></div>
        </div>
        <!-- slider_area_end -->

        <!-- intro_area_start -->
        <div class="omp-intro">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-xl-8 col-lg-9">
                        <div class="section_title text-center">
                            <h3 x-text="content.introTitle"></h3>
                            <p x-text="content.introText"></p>
                            <div class="mt-30">
                                <a href="about.html" class="boxed-btn3">About Orlin</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- intro_area_end -->

        <!-- featured_gallery_start -->
        <div class="gallery_area">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-xl-7 col-lg-7">
                        <div class="section_title text-center mb-50">
                            <h3 x-text="content.featuredTitle"></h3>
                            <p x-text="content.featuredSubtitle"></p>
                        </div>
                    </div>
                </div>
            </div>

            <p class="omp-state" x-show="loading" x-text="states.loading"></p>

            <div class="container-fluid p-0">
                <div class="row no-gutters" id="featured-grid" x-cloak>
                    <template x-for="photo in photos" :key="photo.id">
                        <div class="col-xl-4 col-md-4">
                            <div class="single_photography">
                                <div class="thumb">
                                    <img :src="thumb(photo)"
                                         :srcset="srcset(photo)"
                                         sizes="(max-width: 767px) 100vw, 33vw"
                                         :alt="alt(photo)"
                                         loading="lazy">
                                </div>
                                <a :href="large(photo)" class="hover popup-image"
                                   :data-title="photo.title || ''">
                                    <div class="hover_inner">
                                        <h3 x-text="photo.title || 'View photograph'"></h3>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="container">
                <div class="row">
                    <div class="col-12 text-center mt-50">
                        <a href="gallery.html" class="boxed-btn3">See the full gallery</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- featured_gallery_end -->

        <!-- cta_area_start -->
        <div class="omp-cta">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-xl-8 col-lg-9">
                        <div class="section_title text-center">
                            <h3 x-text="content.ctaTitle"></h3>
                            <p x-text="content.ctaText"></p>
                            <div class="mt-30">
                                <a href="booking.html" class="boxed-btn3" x-text="content.ctaButton"></a>
                                <a href="contact.html" class="boxed-btn3">Contact</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- cta_area_end -->

    </div>

    <!-- footer start -->
    <footer class="footer">
        <div class="copy-right_text">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-xl-7 col-md-8">
                        <p class="copy_right ">
                            <!-- Link back to Colorlib can't be removed. Template is licensed under CC BY 3.0. -->
Copyright &copy;<script>document.write(new Date().getFullYear());</script> All rights reserved | This template is made with <i class="fa fa-heart-o" aria-hidden="true"></i> by <a href="https://colorlib.com" target="_blank">Colorlib</a>
<!-- Link back to Colorlib can't be removed. Template is licensed under CC BY 3.0. -->
                        </p>
                    </div>
                    <div class="col-xl-5 col-md-4">
                        <div class="socail_links">
                            <ul>
                                <li>
                                    <a href="#">
                                        <i class="ti-facebook"></i>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <i class="ti-twitter-alt"></i>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <i class="fa fa-instagram"></i>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </footer>
    <!--/ footer end  -->

    <!-- JS here -->
    <script src="js/vendor/modernizr-3.5.0.min.js"></script>
    <script src="js/vendor/jquery-1.12.4.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/isotope.pkgd.min.js"></script>
    <script src="js/waypoints.min.js"></script>
    <script src="js/jquery.counterup.min.js"></script>
    <script src="js/imagesloaded.pkgd.min.js"></script>
    <script src="js/scrollIt.js"></script>
    <script src="js/jquery.scrollUp.min.js"></script>
    <script src="js/wow.min.js"></script>
    <script src="js/nice-select.min.js"></script>
    <script src="js/jquery.slicknav.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/jquery.ajaxchimp.min.js"></script>
    <script src="js/main.js"></script>

    <!-- Capa de aplicación: Alpine.js y servicios propios. No forma parte del template. -->
    <script src="js/vendor/sweetalert2.min.js"></script>
    <script src="js/app/config.js"></script>
    <script src="js/app/content.js"></script>
    <script src="js/app/alertService.js"></script>
    <script src="js/app/apiService.js"></script>
    <script src="js/app/mediaHelpers.js"></script>
    <script src="js/app/domHelpers.js"></script>
    <script src="js/app/pluginBridge.js"></script>
    <script src="js/app/placeholderPhotos.js"></script>
    <script src="js/app/galleryService.js"></script>
    <script src="js/app/pages/homePage.js"></script>
    <script defer src="js/vendor/alpine.min.js"></script>

</body>

</html>
