    <div x-data="galleryDetailPage" x-init="init()">

        <!-- Encabezado tipográfico. La página ya no abre con una fotografía
             de cabecera: las del álbum empiezan justo debajo y dos capas de
             fotografía seguidas se anulan. <section> y no <header>: omp-custom
             posiciona en absoluto todo elemento <header> del documento. -->
        <section class="omp-album-head">
            <div class="container">
                <p class="omp-eyebrow" x-text="content.title"></p>
                <h1 class="omp-album-head__name" x-text="title"></h1>
                <p class="omp-album-head__description" x-cloak
                   x-show="description" x-text="description"></p>
                <p class="omp-album-head__count" x-cloak
                   x-show="countLabel" x-text="countLabel"></p>

                <!-- Menú de álbumes. Clase propia y no .portfolio-menu: el
                     template no la estila y main.js le engancha un filtro de
                     Isotope sobre esta misma grilla. -->
                <nav class="omp-album-menu" aria-label="Albums" x-cloak>
                    <template x-for="item in categories" :key="item.id">
                        <button type="button"
                                :class="{ 'active': item.slug === slug }"
                                :aria-current="item.slug === slug ? 'true' : null"
                                @click="select(item.slug)"
                                x-text="item.name"></button>
                    </template>
                </nav>
            </div>
        </section>

        <!-- gallery_area  -->
        <div class="gallery_area omp-album-body">
            <div class="container">
                <p class="omp-state" x-show="loading" x-text="states.loading"></p>
                <p class="omp-state" x-show="notice" x-text="notice" x-cloak></p>
                <p class="omp-state" x-cloak
                   x-show="!loading && !notFound && !photos.length"
                   x-text="content.emptyAlbum"></p>

                <div class="omp-state" x-cloak x-show="!loading && notFound">
                    <p x-text="content.notFoundText"></p>
                    <p><a href="gallery.html" x-text="content.backToAlbums"></a></p>
                </div>
            </div>

            <!-- Isotope solo reposiciona sus nodos y Magnific abre un overlay
                 aparte: ninguno los clona, así que x-for es seguro aquí. -->
            <div class="omp-mosaic" id="album-grid"
                 :class="{ 'is-swapping': swapping }"
                 data-omp-reveal-stagger="70" x-cloak>
                <div class="omp-mosaic__sizer" aria-hidden="true"></div>

                <template x-for="photo in photos" :key="photo.id">
                    <div class="omp-mosaic__item grid-item">
                        <!-- La aparición vive en el enlace y no en .grid-item,
                             que es donde Isotope escribe su propio transform. -->
                        <a class="omp-mosaic__link popup-image"
                           :href="large(photo)"
                           :data-title="photo.title || ''"
                           data-omp-reveal="scale">
                            <div class="omp-mosaic__frame" :style="frameStyle(photo)">
                                <img :src="thumb(photo)"
                                     :srcset="srcset(photo)"
                                     sizes="(max-width: 575px) 100vw, (max-width: 991px) 50vw, 33vw"
                                     :alt="alt(photo)"
                                     loading="lazy">
                            </div>
                        </a>
                    </div>
                </template>
            </div>
        </div>
        <!-- /gallery_area  -->
